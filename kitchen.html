<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d7a45"><title>Benito's Kitchen</title><link rel="stylesheet" href="/styles.css"></head><body class="kitchen-body"><div id="pinOverlay" class="pin-overlay"><div class="pin-card"><div style="font-size:62px">🌯</div><h2>Benito's Kitchen</h2><p>Enter the kitchen PIN.</p><input id="pinInput" type="password" inputmode="numeric" maxlength="12" placeholder="••••"><button class="primary" id="pinBtn">Open kitchen</button><div class="pin-error" id="pinError"></div></div></div><div class="kitchen-shell"><header class="kitchen-header"><div class="kitchen-brand"><div><h1>Benito's Kitchen 🌯</h1><small>Backus, MN • live burrito board</small></div><button class="refresh-btn" id="refreshBtn">↻</button></div><div class="tabs"><button class="tab active" data-filter="active">Active <span id="activeCount"></span></button><button class="tab" data-filter="complete">Completed</button><button class="tab" data-filter="all">All</button></div></header><main class="kitchen-main"><div class="kitchen-status" id="statusLine">Ready.</div><div id="ticketList"></div></main></div><script src="/kitchen.js"></script></body></html>
